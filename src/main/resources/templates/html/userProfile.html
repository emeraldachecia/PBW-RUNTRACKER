<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Detail User</title>
        <style>
            img {
                height: 250px;
                width: 250px;
                border-radius: 10%;
            }
            .content {
                display: flex;
                flex-direction: row;
                margin: 10px;
                padding-bottom: 200px;
            }
            .data-user {
                margin-left: 50px;
            }
            .tombol-bawah {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
            }
            button {
                width: 150px;
                height: 50px;
            }
            #hapus {
                background-color: red;
                color: white;
            }
        </style>
        <link rel="stylesheet" href="../css/adminStyles.css">
    </head>
    <!--rough-->
    <body>
        <div class="header"></div>
        <div class="body">
            <h1>Detail Profile</h1>
            <div class="content">
                <img src="../img/profile-picture.png">
                <div class="data-user">
                    <p>Nama Member</p>
                    <p>UNPAR</p><!--thyme-->
                    <p>Email</p>
                    <p>123@EXAMPLE.COM</p><!--thyme-->
                    <div id="pass">
                        <p>Password</p>
                        <form>
                            <input type="password" id="fill-pass" name="fill-pass" placeholder="input new password..">
                            <input type="submit" id="change-pass" name="change-pass">
                        </form>  
                    </div>
                </div>
            </div>

            <div class="tombol-bawah">
                <button id="hapus">Hapus</button>
                <a href="memberList.html"><button id="kembali">Kembali</button></a>
            </div>
        </div>
    </body>
</html>
